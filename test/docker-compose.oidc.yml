# Overlay adding Keycloak so the OIDC-specific acceptance tests can run.
#
#   docker compose -f docker-compose.yml -f docker-compose.oidc.yml up -d
#
# The realm, client, user and group definitions are vendored from upstream
# (keycloak/realm-secobserve.json): realm "secobserve", public client
# "secobserve" with direct access grants, user "keycloak_user" / "keycloak"
# in group "keycloak-group". The group mapper emits the bare group name (no
# leading slash) in the "groups" claim of the ID token, so an
# Authorization_Group with oidc_group = "keycloak-group" is the mapping target.
#
# KC_HOSTNAME is pinned so the "iss" claim always matches OIDC_AUTHORITY.
# Consequently tokens have to be fetched via http://keycloak:8080, i.e. from
# the compose network — these tests run in the devcontainer or in CI, not from
# a bare host shell.
services:
  backend:
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      OIDC_AUTHORITY: http://keycloak:8080/realms/secobserve
      OIDC_CLIENT_ID: secobserve
      OIDC_USERNAME: preferred_username
      OIDC_FIRST_NAME: given_name
      OIDC_LAST_NAME: family_name
      OIDC_FULL_NAME: ""
      OIDC_EMAIL: email
      OIDC_GROUPS: groups

  keycloak:
    image: keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
